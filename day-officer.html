    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --primary: #a855f7;
            --blue: #3b82f6;
            --green: #10b981;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); padding: 16px; max-width: 1050px; margin: auto; }
        
        .top-nav { display: flex; gap: 8px; background: var(--card); padding: 10px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .nav-btn { color: var(--text); text-decoration: none; padding: 7px 12px; border-radius: 10px; font-weight: 700; background: var(--bg); border: 1px solid var(--border); font-size: 0.86em; }
        .nav-btn:hover, .nav-btn.active { background: var(--primary); color: #fff; border-color: #c084fc; }
        .nav-home { background: #2563eb; color: #fff; border-color: var(--blue); }

        .header { text-align: center; padding: 20px 16px; background: linear-gradient(135deg, rgba(168, 85, 247, 0.14), rgba(37, 99, 235, 0.14)); border-radius: 18px; margin-bottom: 20px; border: 2px solid var(--primary); }
        .header h1 { margin: 0; font-size: 1.65em; color: #c084fc; }
        .header p { color: #cbd5e1; margin: 6px 0 0; font-size: 0.95em; }

        .card { background: var(--card); padding: 20px; border-radius: 18px; border: 1px solid var(--border); margin-bottom: 20px; }
        .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
        .card-head h3 { margin: 0; color: #c084fc; font-size: 1.15em; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 14px; }
        label { display: block; color: #93c5fd; font-weight: 700; margin-bottom: 6px; font-size: 0.92em; }
        input, select { width: 100%; padding: 11px 13px; border: 2px solid var(--border); border-radius: 11px; background: var(--bg); color: var(--text); font-family: inherit; font-size: 15px; }
        input:focus, select:focus { border-color: var(--primary); outline: none; }
        input:disabled, select:disabled { opacity: 0.55; cursor: not-allowed; }

        .smart-hint { margin-top: 8px; padding: 10px 14px; border-radius: 10px; font-size: 0.9em; font-weight: 700; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
        .smart-hint.ok { border-color: var(--green); color: #34d399; background: rgba(16, 185, 129, 0.08); }
        .smart-hint.warn { border-color: #f59e0b; color: #fbbf24; background: rgba(245, 158, 11, 0.08); }
        .smart-hint.err { border-color: #ef4444; color: #f87171; background: rgba(239, 68, 68, 0.08); }

        .btn-mini { padding: 7px 13px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: #38bdf8; font-family: inherit; font-size: 0.86em; font-weight: 700; cursor: pointer; }
        .btn-mini:hover:not(:disabled) { border-color: #38bdf8; }
        .btn-mini:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-add { width: 100%; padding: 13px; border: none; border-radius: 11px; background: var(--blue); color: #fff; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-add:hover:not(:disabled) { background: #2563eb; }
        .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 11px; background: linear-gradient(135deg, #7e22ce, var(--green)); color: #fff; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer; margin-top: 14px; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .table-container { overflow-x: auto; border-radius: 11px; border: 1px solid var(--border); }
