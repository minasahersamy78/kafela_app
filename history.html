<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الأرشيف الكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px; max-width: 1150px; margin: auto; }
        .top-nav { display: flex; gap: 8px; background: #1e293b; padding: 12px; border-radius: 15px; border: 1px solid #334155; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
        .nav-btn { color: #f8fafc; text-decoration: none; padding: 8px 14px; border-radius: 10px; font-weight: 700; background: #0f172a; border: 1px solid #334155; font-size: 0.9em; }
        .nav-btn:hover, .nav-btn.active { background: #3b82f6; color: #fff; border-color: #60a5fa; }
        .nav-home { background: #2563eb; color: #fff; border-color: #3b82f6; }
        .form-container { background: #1e293b; padding: 20px; border-radius: 20px; border: 1px solid #334155; }
        .filter-container { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        input, select { padding: 12px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: white; font-family: 'Cairo'; width: 100%; box-sizing: border-box; }
        .btn-refresh { background: #10b981; color: white; border: none; padding: 12px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; font-family: 'Cairo'; }
        .table-container { overflow-x: auto; width: 100%; border-radius: 12px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; font-size: 0.95em; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #334155; white-space: nowrap; }
        th { background: #0f172a; color: #38bdf8; }
        .cat-badge { background: #0f172a; padding: 4px 8px; border-radius: 6px; border: 1px solid #334155; }
        .status-fulfilled { color: #10b981; font-weight: bold; }
        .status-partial { color: #f59e0b; font-weight: bold; }
        .link-img { color: #38bdf8; font-weight: bold; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="index.html" class="nav-btn nav-home">🏠 القائمة الرئيسية</a>
        <a href="servant.html" class="nav-btn">🛒 بوابة الخدام</a>
        <a href="inventory.html" class="nav-btn">📦 رصيد المخزون</a>
        <a href="add-product.html" class="nav-btn">➕ إضافة صنف</a>
        <a href="admin-requests.html" class="nav-btn">📋 إدارة الطلبات</a>
        <a href="history.html" class="nav-btn active">🗂️ الأرشيف</a>
        <a href="reports.html" class="nav-btn">📊 التقارير</a>
    </div>

    <h2 style="color:#38bdf8; margin-bottom:20px;">🗂️ 5. السجل والأرشيف الدائم للطلبات</h2>

    <div class="form-container">
        <div class="filter-container">
            <div style="flex: 2;"><input type="text" id="histSearch" placeholder="بحث باسم الطالب أو المنتج أو الرقم..." oninput="renderHistory()"></div>
            <div style="flex: 1;"><select id="histCategory" onchange="renderHistory()"><option value="الكل">كل الأقسام</option></select></div>
            <button class="btn-refresh" onclick="loadHistory()" id="syncBtn">🔄 تحديث الأرشيف</button>
        </div>
        <div id="histSummary" style="margin: 0 0 12px; color: #94a3b8; font-weight: 600;"></div>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>التاريخ</th><th>الطالب</th><th>رقم التواصل</th><th>القسم</th><th>المنتج</th><th>الوحدة</th><th>المطلوب</th><th>المصروف</th><th>مطلوب شراؤه</th><th>تم شراؤه</th><th>الحالة</th><th>الصورة</th></tr>
                </thead>
                <tbody id="historyTableBody"><tr><td colspan="12">⏳ جاري تحميل السجل...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        const historyURL = 'https://script.google.com/macros/s/AKfycbxEadAjxysbvSYkCicB1AfmKP--JBPoNNHIwhE605rXk2o-z1pQxEi6PPdAhvWHkV9OSA/exec';
        const purchaseURL = 'https://script.google.com/macros/s/AKfycbwZOLwntroP8_uXGI2j2z3sGKagwxr3F14MJiIaUF5f6Hly6D0BkosGuo8pJzuv1uZraw/exec';
        const activeToken = sessionStorage.getItem('adminPass') || 'admin123';
        
        let historyDataGlobal = [], purchaseDataGlobal = [];
        let historyLoaded = false, historyError = '';
        
        const histSource = () => historyURL ? historyDataGlobal : purchaseDataGlobal;
        const escH = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        async function loadHistory() {
            const btn = document.getElementById('syncBtn');
            btn.disabled = true; btn.innerText = '⏳...';
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '<tr><td colspan="12">⏳ جاري تحميل السجل...</td></tr>';
            
            if (historyURL) {
                try {
                    const txt = await (await fetch(historyURL + '?action=getHistory&pass=' + encodeURIComponent(activeToken))).text();
                    let d; try { d = JSON.parse(txt); } catch (e) { throw new Error('تعذر قراءة بيانات السجل الأرشيفي.'); }
                    if (!Array.isArray(d)) throw new Error((d && d.error) || 'رد غير متوقع من سيرفر السجل');
                    historyDataGlobal = d.reverse(); historyLoaded = true; historyError = '';
                } catch (e) {
                    historyLoaded = false; historyError = e.message || String(e);
                    
                    try {
                        const r = await fetch(purchaseURL + "?pass=" + encodeURIComponent(activeToken));
                        const pd = await r.json();
                        purchaseDataGlobal = Array.isArray(pd) ? pd.reverse() : [];
                    } catch(err) {}
                }
            }
            renderHistory();
            btn.disabled = false; btn.innerText = '🔄 تحديث الأرشيف';
        }

        function renderHistory() {
            const tbody = document.getElementById('historyTableBody');
            if (historyURL && !historyLoaded) { tbody.innerHTML = historyError ? `<tr><td colspan="12" style="color:#ef4444;">⚠️ تعذر تحميل السجل: ${escH(historyError)}</td></tr>` : '<tr><td colspan="12">⏳ جاري تحميل السجل...</td></tr>'; document.getElementById('histSummary').textContent = ''; return; }
            
            const sel = document.getElementById('histCategory');
            const q = document.getElementById('histSearch').value.trim().toLowerCase();

            const cur = sel.value;
            const cats = [...new Set(histSource().map(r => r.category).filter(Boolean))];
            sel.innerHTML = '<option value="الكل">كل الأقسام</option>' + cats.map(c => `<option value="${escH(c)}">${escH(c)}</option>`).join('');
            sel.value = cats.includes(cur) ? cur : 'الكل';

            const list = histSource().filter(r =>
                (sel.value === 'الكل' || r.category === sel.value) &&
                (!q || `${r.requesterName} ${r.item} ${r.contactNumber}`.toLowerCase().includes(q)));

            let bought = 0, waiting = 0, rejected = 0, pending = 0;
            list.forEach(r => { if (r.status === 'REJECTED') rejected++; else if (r.status === 'PENDING_APPROVAL') pending++; else if (r.status === 'PO_CONFIRMED') bought++; else if ((parseFloat(r.purchase_qty_needed) || 0) > 0) waiting++; });
            document.getElementById('histSummary').textContent = `عدد الطلبات: ${list.length} — تم شراؤها: ${bought} — بانتظار الشراء: ${waiting} — مرفوضة: ${rejected} — بانتظار التأكيد: ${pending}`;

            if (!list.length) { tbody.innerHTML = '<tr><td colspan="12">لا توجد طلبات في السجل.</td></tr>'; return; }
            
            tbody.innerHTML = list.map(r => {
                const needed = parseFloat(r.purchase_qty_needed) || 0;
                const done = r.status === 'PO_CONFIRMED';
                const boughtQty = done ? needed : 0;
                
                let st = '<span class="status-fulfilled">تم التوريد من المخزن ✅</span>';
                if (r.status === 'PENDING_APPROVAL') st = '<span class="status-partial">بانتظار التأكيد ⏳</span>';
                else if (r.status === 'REJECTED') st = '<span style="color:#ef4444; font-weight:bold;">مرفوضة ❌</span>';
                else if (done) st = '<span class="status-fulfilled">تم الشراء والتوريد ✅</span>';
                else if (needed > 0) st = '<span class="status-partial">بانتظار الشراء ⏳</span>';
                
                const img = (r.image && String(r.image).startsWith('http')) ? `<a href="${escH(r.image)}" target="_blank" class="link-img">عرض 🖼️</a>` : '-';
                
                return `<tr>
                    <td>${escH(r.date)}</td>
                    <td style="color:#38bdf8; font-weight:bold;">${escH(r.requesterName)}</td>
                    <td>${escH(r.contactNumber)}</td>
                    <td><span class="cat-badge">${escH(r.category)}</span></td>
                    <td style="font-weight:bold;">${escH(r.item)}</td>
                    <td>${escH(r.unit)}</td>
                    <td>${escH(r.requested_qty)}</td>
                    <td>${escH(r.fulfilled_from_stock)}</td>
                    <td style="color:${needed > 0 ? '#f59e0b' : '#f8fafc'}; font-weight:bold;">${needed}</td>
                    <td style="color:#10b981; font-weight:bold;">${boughtQty}</td>
                    <td>${st}</td>
                    <td>${img}</td></tr>`;
            }).join('');
        }

        loadHistory();
    </script>
</body>
</html>
